name: Nightly Prebake

on:
  schedule:
    - cron: '0 7 * * *'   # 3am ET year-round (7am UTC; 3am EDT / 2am EST)
    - cron: '0 22 * * *'  # 6pm ET year-round (22 UTC; 6pm EDT / 5pm EST)
  workflow_dispatch: {}   # manual trigger from GitHub UI

permissions:
  contents: write
  actions: read   # alert step reads the previous run's conclusion (grace check)

jobs:
  prebake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run prebake script
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: node scripts/prebake.js

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "Jacob HL"
          git config user.email "jacobhl3ca@gmail.com"
          git add public/photos/ public/data/
          git commit -m "Prebake: nightly photo + bio update [$(date -u +%Y-%m-%d)]"
          # Retry push up to 3 times (transient 403s from GitHub token).
          # Exit 0 the moment a push succeeds; if all 3 fail, exit 1 so the job
          # fails and the alert step fires. (Without this the loop's last command
          # is a sleep, so the step would exit 0 and a push-only failure — stale
          # site, no commit landed — would go completely unnoticed.)
          for i in 1 2 3; do
            git push && exit 0
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All 3 push attempts failed."
          exit 1

      # Real-failure alert — ntfy ONLY, never a GitHub issue (rewritten 2026-07-20
      # alongside the nospoilerscores monitors). House rule for ALL monitors:
      # DOWN-only, grace period, no green "recovered" pings. Opening/commenting on
      # an issue @-mentions Jacob and emails him on every single failure, which is
      # exactly the noise this replaces. Only alerts when the PREVIOUS run of this
      # workflow also failed, so one bad night that self-heals is silent.
      - name: Alert on sustained failure (ntfy, 1-run grace)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          prev="$(gh run list --workflow prebake.yml --status completed \
                    --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
          if [ "$prev" != "failure" ]; then
            echo "First failure (previous run: ${prev:-none}) — inside grace, staying silent."
            exit 0
          fi
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::NTFY_TOPIC secret unset — cannot alert."
            exit 0
          fi
          curl -s -H "Title: Comedy Cellar prebake failing" -H "Priority: high" -H "Tags: rotating_light" \
            -d "Nightly prebake has failed twice in a row — site may serve stale lineups. $run_url" \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
