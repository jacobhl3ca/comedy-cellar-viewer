<svg xmlns="http://www.w3.org/2000/svg" width="138" height="40" viewBox="0 0 138 40" role="img" aria-label="Get it on Google Play">
  <title>Get it on Google Play</title>
  <rect width="138" height="40" rx="5" ry="5" fill="#000"/>
  <rect x="0.5" y="0.5" width="137" height="39" rx="4.5" ry="4.5" fill="none" stroke="#a6a6a6" stroke-width="1"/>
  <g transform="translate(9 8)">
    <path fill="#00D9FF" d="M0.4 0.3C0.15 0.56 0 0.97 0 1.5v21c0 .53.15.94.4 1.2L12.4 12z"/>
    <path fill="#00F076" d="M16.4 8L1.7.1C1.2-.1.75-.05.4.3L12.4 12z"/>
    <path fill="#FFD400" d="M16.4 8L12.4 12l4 4 4.6-2.6c1.4-.8 1.4-2 0-2.8z"/>
    <path fill="#FF3A44" d="M0.4 23.7c.35.35.8.4 1.3.2L16.4 16 12.4 12z"/>
  </g>
  <!-- textLength + lengthAdjust pin both lines to an exact width, so the badge
       renders identically whether the viewer has Roboto, Helvetica or Arial.
       Without it the wordmark measured 92.3px from x=43 inside a 135px badge,
       i.e. 0px of right padding, and it read as clipped against the border. -->
  <text x="38" y="15" fill="#fff" font-family="Roboto, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" letter-spacing="0.6" textLength="45" lengthAdjust="spacingAndGlyphs">GET IT ON</text>
  <text x="38" y="31" fill="#fff" font-family="Roboto, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" textLength="89.5" lengthAdjust="spacingAndGlyphs">Google Play</text>
</svg>
